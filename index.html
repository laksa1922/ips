<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- ================== OPTIMASI JARINGAN (TAMBAHAN) ================== -->

  <link rel="dns-prefetch" href="https://docs.google.com">

  <!-- ================================================================ -->

  <style>
    :root {
      --bg: #f5f7fa;
      --text: #333;
      --card: #fff;
      --card-shadow: rgba(0,0,0,0.08);
      --table-head: #f0f2f5;
      --table-border: #eaeaea;
      --accent: #2c3e50;
      --accent-light: #3498db;
    }
    body.dark {
      --bg: #111;
      --text: #eee;
      --card: #1e1e1e;
      --card-shadow: rgba(0,0,0,0.4);
      --table-head: #2a2a2a;
      --table-border: #333;
      --accent: #ecf0f1;
      --accent-light: #3498db;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      padding: 25px 15px 15px;
      border-bottom: 2px solid var(--accent-light);
    }
    .header h1 {
      margin: 0;
      font-size: 2em;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .header p {
      margin: 5px 0 0;
      font-size: 1em;
      color: var(--accent-light);
      font-style: italic;
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.9em;
      color: var(--accent);
      border-top: 1px solid var(--table-border);
    }
    body.dark .footer {
      color: var(--accent-light);
    }

    .toggle-dark {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #3498db;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: background 0.3s, transform 0.2s;
      z-index: 1000;
    }
    .toggle-dark:hover { background: #2980b9; transform: rotate(15deg); }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 4px 10px var(--card-shadow);
      margin-bottom: 20px;
      padding: 18px;
      transition: transform 0.2s, background 0.3s;

      /* ===== OPTIMASI RENDER (TAMBAHAN) ===== */
      contain: content;
    }
    .card:hover { transform: translateY(-3px); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 8px;
    }

    .last-update {
      font-size: 0.9em;
      color: #777;
      margin-bottom: 12px;
    }
    body.dark .last-update { color: #aaa; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--table-border);
      text-align: center;
    }
    th {
      background: var(--table-head);
      font-weight: 600;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85em;
      color: #fff;
      display: inline-block;
      min-width: 60px;
    }

    .on { background: #27ae60; }
    .off { background: #e74c3c; }
    .rendah { background: #e74c3c; }
    .normal { background: #2980b9; }
    .penuh { background: #f1c40f; color:#000; }
    .mcb-normal { background: #2980b9; }
    .trip { background: #f1c40f; color:#000; }

    .loader {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3498db;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: .6; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-container table {
      min-width: 500px;
    }
  </style>
</head>
<body>

<!-- ================== OPTIMASI FETCH (TAMBAHAN) ================== -->
<script>
  const _origFetch = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === "string" && url.includes("output=csv")) {
      const sep = url.includes("?") ? "&" : "?";
      url = url + sep + "_ts=" + Date.now();
    }
    return _origFetch(url, opts);
  };
</script>
