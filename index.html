<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pompa & Tandon</title>

  <!-- ICON HALAMAN -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

  <style>
  /* ===== CSS ANDA TIDAK DIUBAH ===== */
    :root {
      --bg: #f5f7fa;
      --text: #333;
      --card: #fff;
      --card-shadow: rgba(0,0,0,0.08);
      --table-head: #f0f2f5;
      --table-border: #eaeaea;
      --accent: #2c3e50;
      --accent-light: #3498db;
    }
    body.dark {
      --bg: #111;
      --text: #eee;
      --card: #1e1e1e;
      --card-shadow: rgba(0,0,0,0.4);
      --table-head: #2a2a2a;
      --table-border: #333;
      --accent: #ecf0f1;
      --accent-light: #3498db;
    }
    body { margin:0;padding:20px;font-family:"Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
    .card {background:var(--card);border-radius:14px;box-shadow:0 4px 10px var(--card-shadow);margin-bottom:20px;padding:18px;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:8px;border-bottom:1px solid var(--table-border);text-align:center;}
    .badge{padding:3px 8px;border-radius:6px;font-weight:bold;color:#fff;font-size:0.85em;}
    .off{background:#e74c3c;}
  </style>
</head>

<body>

<div class="card" id="section-joglo">
  <div id="update-joglo">-</div>
  <div id="table-joglo">Memuat...</div>
</div>

<div class="card" id="section-kantin">
  <div id="update-kantin">-</div>
  <div id="table-kantin">Memuat...</div>
</div>

<div class="card" id="section-lt6">
  <div id="update-lt6">-</div>
  <div id="table-lt6">Memuat...</div>
</div>

<script>
/* ===============================
   KODE ASLI ANDA
=============================== */

const sources = {
  joglo: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
  kantin: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
  lt6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2q5WkdqPKnd4D37-45O3LSc2KC7nMfRVDWz2crolUEyUOgnhuHxjGgU42BG0q_ddnl8vw_DJ_mcRV/pub?gid=0&single=true&output=csv'
};

const lastData = { joglo: [], kantin: [], lt6: [] };


/* ======================================================
   ⭐ TAMBAHAN FITUR WAKTU SAJA (TIDAK MENGUBAH KODE LAMA)
====================================================== */

const MAX_DELAY_SECONDS = 120;

function parseESPTime(str){
  if(!str) return null;

  const now = new Date();

  if(/^\d{2}:\d{2}:\d{2}$/.test(str)){
    const [h,m,s] = str.split(":");
    return new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,s);
  }

  const d = new Date(str);
  return isNaN(d)?null:d;
}

function isTimeStale(str){
  const t = parseESPTime(str);
  if(!t) return false;
  return ((Date.now() - t.getTime())/1000) > MAX_DELAY_SECONDS;
}

function markOffline(key,state){
  document.getElementById("section-"+key).style.border =
    state ? "3px solid #e74c3c" : "none";
}


/* ===============================
   FUNGSI ASLI + SEDIKIT SISIPAN
=============================== */

function createTableHTML(dataArr, key){
  if(!dataArr.length) return "Data kosong";

  const cells = dataArr[0].split(",");

  /* ===== hanya tambahan waktu ===== */
  const offline = isTimeStale(cells[0]);
  markOffline(key, offline);

  const row = cells.map((val,i)=>{

    if(i===0 && offline){
      return `<td><span class="badge off">OFFLINE</span><br>${val}</td>`;
    }

    return `<td>${val}</td>`;
  }).join("");

  return `<table><tr>${row}</tr></table>`;
}

function updateTimeText(id){
  document.getElementById(id).textContent =
    "Terakhir update: " + new Date().toLocaleTimeString("id-ID");
}

function fetchAndDisplayCSV(url,key){
  fetch(url)
  .then(r=>r.text())
  .then(t=>{
    const rows=t.trim().split("\n").slice(1,2);
    document.getElementById("table-"+key).innerHTML=createTableHTML(rows,key);
    updateTimeText("update-"+key);
  });
}

function refreshAll(){
  fetchAndDisplayCSV(sources.joglo,"joglo");
  fetchAndDisplayCSV(sources.kantin,"kantin");
  fetchAndDisplayCSV(sources.lt6,"lt6");
}

setInterval(refreshAll,10000);
refreshAll();

</script>
</body>
</html>
