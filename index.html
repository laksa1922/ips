<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Monitoring Pompa</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

<style>
:root{
--bg:#05070a;
--text:#e0f2f1;
--card:#0e141b;
--card-shadow:rgba(0,255,200,.25);
--table-head:#0f1923;
--table-border:#1a2633;
--accent:#00ffcc;
--accent-light:#00bcd4;
}

body{
margin:0;
padding:20px;
font-family:Segoe UI,system-ui;
color:var(--text);
background:
linear-gradient(rgba(0,255,180,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,180,.04) 1px,transparent 1px),
var(--bg);
background-size:30px 30px;
}

.header{
text-align:center;
padding:20px;
border-bottom:2px solid var(--accent);
}
.header h1{
margin:0;
color:var(--accent);
text-shadow:0 0 15px rgba(0,255,200,.7);
}
.header p{
margin-top:5px;
color:#7fffd4;
letter-spacing:1px;
}

.card{
background:var(--card);
border:1px solid rgba(0,255,200,.2);
border-radius:14px;
padding:18px;
margin-bottom:22px;
box-shadow:
0 0 25px rgba(0,255,200,.15),
inset 0 0 0 1px rgba(0,255,200,.05);
}

.card-header{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
color:var(--accent);
}

.last-update{
font-size:.85em;
color:#8ad;
margin:8px 0;
}

.loader{
width:10px;height:10px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 12px var(--accent);
animation:pulse 1s infinite;
}

@keyframes pulse{
0%,100%{transform:scale(1);opacity:.6}
50%{transform:scale(1.6);opacity:1}
}

/* ====== POMPA SCADA ====== */
.pump-wrap{display:flex;justify-content:center;margin:12px 0}
.pump{width:90px;height:90px}
.fan{transform-origin:50% 50%}
.pump.on .fan{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.water{opacity:0}
.pump.on .water{opacity:1;animation:flow .6s infinite alternate}
@keyframes flow{from{transform:translateY(0)}to{transform:translateY(6px)}}
.pump.on svg{filter:drop-shadow(0 0 10px rgba(0,255,200,.9))}
.pump.off svg{opacity:.4;filter:grayscale(100%)}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse;font-size:.85em}
th,td{padding:8px;border-bottom:1px solid var(--table-border);text-align:center}
th{background:var(--table-head)}
tr:hover td{background:rgba(0,255,200,.05)}

.badge{
padding:4px 10px;
border-radius:6px;
font-weight:bold;
display:inline-block;
}

.on{background:#00ff88;box-shadow:0 0 12px rgba(0,255,136,.8)}
.off{background:#ff3b3b;box-shadow:0 0 12px rgba(255,59,59,.8)}
.normal{background:#00cfff;box-shadow:0 0 12px rgba(0,207,255,.8)}
.rendah{background:#ff5252;box-shadow:0 0 12px rgba(255,82,82,.8)}
.penuh{background:#ffeb3b;color:#000;box-shadow:0 0 12px rgba(255,235,59,.8)}
.trip{background:#ff9800;box-shadow:0 0 14px rgba(255,152,0,.8)}

.footer{
text-align:center;
margin-top:30px;
font-size:.85em;
color:#7fffd4;
}
</style>
</head>

<body>

<div class="header">
<h1>⚙️ SCADA Monitoring Pompa & Tandon</h1>
<p>Industrial Control – Real Time</p>
</div>

<!-- JOGLO -->
<div class="card">
<div class="card-header">📍 JOGLO <div class="loader"></div></div>
<div class="pump-wrap">
<div class="pump off" id="pump-joglo">
<svg viewBox="0 0 100 100">
<rect x="15" y="35" width="70" height="30" rx="8" fill="#555"/>
<circle cx="50" cy="50" r="14" fill="#999"/>
<g class="fan">
<rect x="48" y="30" width="4" height="15" fill="#fff"/>
<rect x="48" y="55" width="4" height="15" fill="#fff"/>
<rect x="30" y="48" width="15" height="4" fill="#fff"/>
<rect x="55" y="48" width="15" height="4" fill="#fff"/>
</g>
<rect class="water" x="85" y="42" width="8" height="16" rx="3" fill="#00cfff"/>
</svg>
</div>
</div>
<div id="table-joglo">Loading...</div>
</div>

<!-- KANTIN -->
<div class="card">
<div class="card-header">📍 KANTIN <div class="loader"></div></div>
<div class="pump-wrap">
<div class="pump off" id="pump-kantin">
<svg viewBox="0 0 100 100">
<rect x="15" y="35" width="70" height="30" rx="8" fill="#555"/>
<circle cx="50" cy="50" r="14" fill="#999"/>
<g class="fan">
<rect x="48" y="30" width="4" height="15" fill="#fff"/>
<rect x="48" y="55" width="4" height="15" fill="#fff"/>
<rect x="30" y="48" width="15" height="4" fill="#fff"/>
<rect x="55" y="48" width="15" height="4" fill="#fff"/>
</g>
<rect class="water" x="85" y="42" width="8" height="16" rx="3" fill="#00cfff"/>
</svg>
</div>
</div>
<div id="table-kantin">Loading...</div>
</div>

<div class="footer">
⚡ Instalasi Pemelihara Sarana – RS Adi Husada Kapasari
</div>

<script>
const sources={
joglo:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
kantin:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv'
};

function updatePump(id,val){
const p=document.getElementById(id);
p.className="pump "+(val.toLowerCase().includes("nyala")?"on":"off");
}

function load(key){
fetch(sources[key]).then(r=>r.text()).then(t=>{
const d=t.trim().split("\n")[1].split(",");
updatePump("pump-"+key,d[1]);
document.getElementById("table-"+key).innerHTML=
`<table>
<tr><th>Waktu</th><th>Status</th><th>Level</th><th>Suhu</th></tr>
<tr>
<td>${d[0]}</td>
<td><span class="badge ${d[1].includes("NYALA")?"on":"off"}">${d[1]}</span></td>
<td><span class="badge normal">${d[2]}</span></td>
<td>${d[3]} °C</td>
</tr>
</table>`;
});
}

load("joglo");load("kantin");
setInterval(()=>{load("joglo");load("kantin")},10000);
</script>

</body>
</html>
