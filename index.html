<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pompa & Tandon</title>
  <!-- ICON HALAMAN -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8f1f4;
      --text: #0e2229;
      --muted: #59727b;
      --card: rgba(255,255,255,0.72);
      --card-border: rgba(255,255,255,0.9);
      --card-shadow: rgba(10, 60, 80, 0.14);
      --tile: rgba(255,255,255,0.8);
      --tile-border: rgba(14,138,154,0.16);
      --accent: #0b5563;
      --accent-light: #0e8a9a;
      --glow-a: rgba(14,190,210,0.38);
      --glow-b: rgba(70,110,255,0.26);
      --glow-c: rgba(30,200,150,0.26);
      --ok: #17a673;
    }
    body.dark {
      --bg: #060d11;
      --text: #e6f1f4;
      --muted: #84a0a9;
      --card: rgba(16,30,37,0.72);
      --card-border: rgba(255,255,255,0.07);
      --card-shadow: rgba(0,0,0,0.6);
      --tile: rgba(255,255,255,0.035);
      --tile-border: rgba(255,255,255,0.07);
      --accent: #e6f1f4;
      --accent-light: #3cc9d9;
      --glow-a: rgba(14,190,210,0.20);
      --glow-b: rgba(80,90,255,0.18);
      --glow-c: rgba(20,180,130,0.14);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 0 20px 24px;
      min-height: 100vh;
      font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s, color 0.4s;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }
    /* latar aurora */
    body::before {
      content: "";
      position: fixed; inset: 0;
      z-index: -1;
      background:
        radial-gradient(40vw 40vw at 8% 0%, var(--glow-a), transparent 70%),
        radial-gradient(45vw 45vw at 95% 20%, var(--glow-b), transparent 70%),
        radial-gradient(40vw 40vw at 50% 105%, var(--glow-c), transparent 70%);
    }
    /* grid halus */
    body::after {
      content: "";
      position: fixed; inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(14,138,154,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,138,154,0.07) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
    }

    .wrap { max-width: 1120px; margin: 0 auto; }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      padding: 54px 15px 34px;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8em;
      font-weight: 600;
      color: var(--accent-light);
      background: var(--tile);
      border: 1px solid var(--tile-border);
      margin-bottom: 18px;
    }
    .live i {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(23,166,115,.6);
      animation: ping 1.8s infinite;
    }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(23,166,115,.55); }
      70%,100% { box-shadow: 0 0 0 10px rgba(23,166,115,0); }
    }
    .header h1 {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--accent);
    }
    .header p {
      margin: 12px 0 0;
      font-size: 1.02rem;
      color: var(--muted);
    }
    .header-actions {
      display: none;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 22px 15px 6px;
      margin-top: 34px;
      font-size: 0.88em;
      line-height: 1.7;
      color: var(--muted);
      border-top: 1px solid var(--tile-border);
    }
    .footer b { color: var(--text); font-weight: 700; }

    /* Tombol dark mode + fullscreen */
    .toggle-dark, .toggle-full {
      width: 44px; height: 44px;
      border-radius: 14px;
      border: 1px solid var(--tile-border);
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px -6px var(--card-shadow);
      transition: transform 0.25s, background 0.3s;
    }
    .toggle-dark { position: fixed; top: 16px; right: 16px; z-index: 1000; }
    .toggle-dark:hover { transform: rotate(18deg) scale(1.06); }
    .toggle-full:hover { transform: scale(1.06); }
    .toggle-dark:focus-visible, .toggle-full:focus-visible { outline: 3px solid var(--accent-light); outline-offset: 2px; }

    /* ===== CARD ===== */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 24px 50px -24px var(--card-shadow);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      margin-bottom: 22px;
      padding: 24px;
      overflow: hidden;
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
    }
    /* garis cahaya status di atas kartu */
    .card::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--ok), var(--accent-light), transparent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 1.35em;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .last-update {
      display: inline-block;
      font-size: 0.85em;
      color: var(--muted);
      margin-bottom: 18px;
      font-variant-numeric: tabular-nums;
    }

    /* ===== TILE DATA ===== */
    .table-container { width: 100%; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .tile {
      position: relative;
      padding: 14px 16px 16px;
      background: var(--tile);
      border: 1px solid var(--tile-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      transition: transform 0.2s, border-color 0.2s;
    }
    .tile:hover { border-color: var(--accent-light); }
    .tile-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.8em;
      font-weight: 600;
      color: var(--muted);
    }
    .tile-value {
      font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
      font-size: 1.02em;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    /* ===== BADGE ===== */
    .badge {
      padding: 6px 14px 6px 11px;
      border-radius: 999px;
      font-family: "Manrope", "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 0.9em;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
    }
    .badge::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    /* Warna sesuai permintaan */
    .on        { background: #1f9d57; box-shadow: 0 6px 16px -6px #1f9d57; }
    .off       { background: #d93a2f; box-shadow: 0 6px 16px -6px #d93a2f; }
    .rendah    { background: #d93a2f; box-shadow: 0 6px 16px -6px #d93a2f; }
    .normal    { background: #1f6fb5; box-shadow: 0 6px 16px -6px #1f6fb5; }
    .penuh     { background: #f2c21b; color:#000; box-shadow: 0 6px 16px -6px #f2c21b; }
    .mcb-normal{ background: #1f6fb5; box-shadow: 0 6px 16px -6px #1f6fb5; }
    .trip      { background: #f2c21b; color:#000; box-shadow: 0 6px 16px -6px #f2c21b; }

    /* indikator level tandon */
    .gauge {
      height: 8px;
      border-radius: 99px;
      background: rgba(120,150,160,0.22);
      overflow: hidden;
    }
    .gauge b {
      display: block; height: 100%;
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(.2,.8,.2,1);
    }
    .gauge.rendah b { width: 22%; background: #d93a2f; }
    .gauge.normal b { width: 62%; background: #1f6fb5; }
    .gauge.penuh  b { width: 100%; background: #f2c21b; }

    /* ===== LOADER ===== */
    .loader {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent-light);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: .6; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .changed { animation: flashChange 1.5s ease-in-out; }
    @keyframes flashChange {
      0%   { background: rgba(14,190,210,0.18); box-shadow: 0 0 0 0 rgba(14,190,210,0.6); }
      50%  { background: rgba(14,190,210,0.45); box-shadow: 0 0 0 6px rgba(14,190,210,0); }
      100% { background: var(--tile); }
    }

    /* ===== DATA BERHENTI ===== */
    .stale-card { border: 2px solid #e53935 !important; box-shadow: 0 0 34px rgba(229,57,53,.35); }
    .stale-card::before { background: linear-gradient(90deg, transparent, #e53935, transparent); height: 4px; }
    .stale-update {
      background: #e53935;
      color: #fff !important;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      line-height: 1.5;
      animation: blinkRed 1s infinite;
    }
    @keyframes blinkRed { 0%,100%{opacity:1;} 50%{opacity:.5;} }

    /* ============================================================
       PAS DI LAYAR — layar lebar / landscape (PC, laptop, TV)
       Semua isi muat dalam 100dvh tanpa scroll vertikal.
       Di HP / portrait, layout lama (bertumpuk + scroll) tetap dipakai.
       ============================================================ */
    @media (min-width: 1024px) {
      body {
        height: 100dvh;
        overflow: hidden;
        padding: 0 16px 10px;
      }
      .wrap {
        max-width: 1680px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      /* Header jadi satu baris rapat, bukan blok tengah yang tinggi */
      .header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        text-align: left;
        padding: 12px 4px 10px;
      }
      .header-text { min-width: 0; }
      .live { margin-bottom: 6px; }
      .header h1 { font-size: clamp(1.45rem, 2.2vw, 2rem); }
      .header p { margin: 3px 0 0; font-size: 0.92rem; }
      .header-actions { display: flex; }
      /* Tombol pindah dari pojok fixed ke dalam header */
      .toggle-dark { position: static; width: 40px; height: 40px; }
      .toggle-full { width: 40px; height: 40px; }

      /* 3 kartu sejajar, sama tinggi, mengisi sisa layar */
      .cards {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .card {
        margin-bottom: 0;
        padding: 16px 16px 14px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .card-header { font-size: 1.15em; margin-bottom: 4px; }
      .last-update { margin-bottom: 10px; }
      /* Tile mengisi tinggi kartu, bukan menumpuk ke bawah */
      .table-container { flex: 1 1 auto; min-height: 0; display: flex; }
      .tiles {
        flex: 1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: 1fr;
        gap: 10px;
      }
      /* Lantai 6 cuma 4 tile: 2x2 supaya tidak ada baris kosong */
      #section-lt6 .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile { padding: 10px 12px; gap: 6px; justify-content: center; }
      .tile-label { font-size: 0.78em; }
      .tile-value { font-size: 0.98em; }
      .badge { font-size: 0.85em; padding: 5px 12px 5px 10px; }

      .footer {
        flex: 0 0 auto;
        padding: 8px 4px 2px;
        margin-top: 10px;
        line-height: 1.4;
      }
      .footer br { display: none; }
    }

    /* Laptop pendek (mis. 1366x768): rapatkan lagi */
    @media (min-width: 1024px) and (max-height: 800px) {
      .header { padding: 8px 4px 8px; }
      .header h1 { font-size: clamp(1.3rem, 2vw, 1.7rem); }
      .header p { display: none; }
      .card { padding: 12px 14px 10px; border-radius: 18px; }
      .tiles { gap: 8px; }
      .tile { padding: 8px 10px; }
      .footer { font-size: 0.8em; }
    }

    /* Kalau layarnya sangat pendek, jangan paksa: izinkan scroll */
    @media (min-width: 1024px) and (max-height: 540px) {
      body { overflow: auto; height: auto; }
      .wrap { height: auto; }
    }

    @media (max-width: 768px) {
      body { padding: 0 12px 18px; }
      .header { padding: 62px 10px 26px; }
      .card { padding: 18px 14px; border-radius: 18px; }
      .tiles { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .tile { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- HEADER -->
    <div class="header">
      <div class="header-text">
        <div class="live"><i></i> Real-time</div>
        <h1>⚙️ Monitoring Pompa &amp; Tandon</h1>
        <p>Sistem Pemantauan Cerdas Real-time</p>
      </div>
      <div class="header-actions">
        <button class="toggle-full" onclick="toggleFullscreen()" aria-label="Layar penuh" title="Layar penuh">⛶</button>
        <button class="toggle-dark" onclick="toggleDarkMode()" aria-label="Ganti mode tampilan">🌙</button>
      </div>
    </div>

    <main class="cards">
      <div class="card" id="section-joglo">
        <div class="card-header">📍 Joglo <div class="loader" id="loader-joglo"></div></div>
        <div class="last-update" id="update-joglo">Terakhir update: -</div>
        <div id="table-joglo">Memuat data...</div>
      </div>

      <div class="card" id="section-kantin">
        <div class="card-header">📍 Kantin <div class="loader" id="loader-kantin"></div></div>
        <div class="last-update" id="update-kantin">Terakhir update: -</div>
        <div id="table-kantin">Memuat data...</div>
      </div>

      <div class="card" id="section-lt6">
        <div class="card-header">📍 Lantai 6 <div class="loader" id="loader-lt6"></div></div>
        <div class="last-update" id="update-lt6">Terakhir update: -</div>
        <div id="table-lt6">Memuat data...</div>
      </div>
    </main>

    <!-- FOOTER -->
    <div class="footer">
      ⚡ Dibuat oleh <b>Instalasi Pemelihara Sarana (IPS)</b><br>
      Rumah Sakit Adi Husada Kapasari
    </div>
  </div>

  <script>
    const sources = {
      joglo: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
      kantin: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
      lt6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSjE2P1J5NhSB1OKmTRzp5cseUmRANUawdgIWBxq1DfFxADjjagrCSjIGTp-YDNh533XkzdBc_dFzw_/pub?gid=0&single=true&output=csv'
    };

    const lastData = { joglo: [], kantin: [], lt6: [] };
    const MAX_DELAY_MINUTES = 30;

    function applyStatus(val, key, i) {
      const lc = val.toLowerCase();
      if (key === "joglo") {
        if (i === 1) return lc.includes("nyala") ? "on" : "off";
        if (i === 2) {
          if (lc.includes("rendah")) return "rendah";
          if (lc.includes("penuh")) return "penuh";
          return "normal";
        }
      }
      if (key === "kantin") {
        if (i === 1) return lc.includes("nyala") ? "on" : "off";
        if (i === 2) {
          if (lc.includes("rendah")) return "rendah";
          if (lc.includes("penuh")) return "penuh";
          return "normal";
        }
        if (i === 4) return lc.includes("trip") ? "trip" : "mcb-normal";
      }
      if (key === "lt6") {
        if (i === 1) {
          if (lc.includes("rendah")) return "rendah";
          if (lc.includes("penuh")) return "penuh";
          return "normal";
        }
      }
      return "";
    }

    function getHeaders(key) {
      if (key === "joglo") return ["Waktu","Status Pompa","Level Tandon","Suhu Pompa","RSSI","IP Address"];
      if (key === "kantin") return ["Waktu","Status Pompa","Level Tandon","Suhu Pompa","MCB","RSSI","IP Address"];
      if (key === "lt6") return ["Waktu","Level Tandon","RSSI","IP Address"];
      return [];
    }

    const ICONS = {
      "Waktu": "🕒", "Status Pompa": "⚙️", "Level Tandon": "💧",
      "Suhu Pompa": "🌡️", "MCB": "🔌", "RSSI": "📶", "IP Address": "🌐"
    };

    function createTableHTML(dataArr, key) {
      if (!dataArr.length) return "Data tidak tersedia.";
      const headers = getHeaders(key);
      const cells = dataArr[0].split(",").slice(0, headers.length);

      const tilesHTML = cells.map((val, i) => {
        const status = applyStatus(val, key, i);
        const changed = lastData[key][i] !== undefined && lastData[key][i] !== val;
        lastData[key][i] = val;
        const isLevel = headers[i] === "Level Tandon";
        return `
          <div class="tile ${changed ? "changed" : ""}">
            <div class="tile-label"><span>${ICONS[headers[i]] || ""}</span>${headers[i]}</div>
            <div class="tile-value">${status ? `<span class="badge ${status}">${val}</span>` : val}</div>
            ${isLevel ? `<div class="gauge ${status}"><b></b></div>` : ""}
          </div>`;
      }).join("");

      return `<div class="table-container"><div class="tiles">${tilesHTML}</div></div>`;
    }

    function updateTimeText(id) {
      const now = new Date().toLocaleTimeString("id-ID");
      document.getElementById(id).textContent = "Terakhir update: " + now;
    }

    function checkDataAge(sheetTime, key) {
      const p = sheetTime.trim().split(" ");
      if (p.length < 2) return;
      const d = p[0].split("/");
      const t = p[1].split(":");
      const dataDate = new Date(+d[2], +d[1]-1, +d[0], +t[0], +t[1], +t[2]);
      const diff = (new Date() - dataDate) / 60000;
      const card = document.getElementById("section-" + key);
      const upd = document.getElementById("update-" + key);
      if (diff >= MAX_DELAY_MINUTES) {
        card.classList.add("stale-card");
        upd.classList.add("stale-update");
        upd.innerHTML = "🔴 DATA BERHENTI (" + Math.floor(diff) + " menit)<br>Update terakhir : " + sheetTime;
      } else {
        card.classList.remove("stale-card");
        upd.classList.remove("stale-update");
        updateTimeText("update-" + key);
      }
    }

    function fetchAndDisplayCSV(url, key) {
      const tableId = "table-" + key;
      const loaderId = "loader-" + key;
      const updateId = "update-" + key;
      document.getElementById(loaderId).style.display = "inline-block";

      fetch(url)
        .then(res => res.text())
        .then(data => {
          const rows = data.trim().split("\n").slice(1, 2);
          const waktuSheet = rows[0].split(",")[0];
          document.getElementById(tableId).innerHTML = createTableHTML(rows, key);
          checkDataAge(waktuSheet, key);
          document.getElementById(loaderId).style.display = "none";
        })
        .catch(() => {
          document.getElementById(tableId).innerHTML = "<i style='color:#e53935'>Gagal memuat data.</i>";
          document.getElementById(loaderId).style.display = "none";
        });
    }

    function refreshAll() {
      fetchAndDisplayCSV(sources.joglo, "joglo");
      fetchAndDisplayCSV(sources.kantin, "kantin");
      fetchAndDisplayCSV(sources.lt6, "lt6");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      const btn = document.querySelector(".toggle-dark");
      const isDark = document.body.classList.contains("dark");
      btn.textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        document.querySelector(".toggle-dark").textContent = "☀️";
      } else {
        document.querySelector(".toggle-dark").textContent = "🌙";
      }
      refreshAll();
      setInterval(refreshAll, 10000);
    });
  </script>
</body>
</html>
