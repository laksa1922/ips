<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pompa & Tandon</title>

  <!-- ICON HALAMAN -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

  <style>
    :root {
      --bg:#f5f7fa;
      --text:#333;
      --card:#fff;
      --card-shadow:rgba(0,0,0,0.08);
      --table-head:#f0f2f5;
      --table-border:#eaeaea;
      --accent:#2c3e50;
      --accent-light:#3498db;
    }

    body.dark{
      --bg:#111;
      --text:#eee;
      --card:#1e1e1e;
      --card-shadow:rgba(0,0,0,0.4);
      --table-head:#2a2a2a;
      --table-border:#333;
      --accent:#ecf0f1;
      --accent-light:#3498db;
    }

    body{
      margin:0;
      padding:20px;
      font-family:"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .toggle-dark{
      position:fixed;
      top:15px;
      right:15px;
      width:40px;
      height:40px;
      border-radius:50%;
      border:none;
      background:#3498db;
      color:#fff;
      cursor:pointer;
    }

    .card{
      background:var(--card);
      border-radius:14px;
      box-shadow:0 4px 10px var(--card-shadow);
      margin-bottom:20px;
      padding:18px;
      transition:0.2s;
    }

    .card-header{
      display:flex;
      justify-content:space-between;
      font-weight:bold;
    }

    .last-update{
      font-size:0.9em;
      color:#777;
      margin:10px 0;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:0.9em;
    }

    th,td{
      padding:8px;
      border-bottom:1px solid var(--table-border);
      text-align:center;
    }

    th{ background:var(--table-head); }

    .badge{
      padding:3px 8px;
      border-radius:6px;
      font-weight:bold;
      color:#fff;
      font-size:0.85em;
    }

    .on{background:#27ae60;}
    .off{background:#e74c3c;}
    .rendah{background:#e74c3c;}
    .normal{background:#2980b9;}
    .penuh{background:#f1c40f;color:#000;}
    .trip{background:#f1c40f;color:#000;}
    .mcb-normal{background:#2980b9;}

    .loader{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#3498db;
      animation:pulse 1s infinite;
    }

    @keyframes pulse{
      50%{transform:scale(1.5);}
    }

    .changed{
      animation:flash 1.2s;
    }

    @keyframes flash{
      50%{background:rgba(52,152,219,.5);}
    }
  </style>
</head>

<body>

<button class="toggle-dark" onclick="toggleDarkMode()">🌙</button>

<h2>⚙️ Monitoring Pompa & Tandon</h2>

<div class="card" id="section-joglo">
  <div class="card-header">Joglo <div class="loader" id="loader-joglo"></div></div>
  <div class="last-update" id="update-joglo">-</div>
  <div id="table-joglo">Memuat...</div>
</div>

<div class="card" id="section-kantin">
  <div class="card-header">Kantin <div class="loader" id="loader-kantin"></div></div>
  <div class="last-update" id="update-kantin">-</div>
  <div id="table-kantin">Memuat...</div>
</div>

<div class="card" id="section-lt6">
  <div class="card-header">Lantai 6 <div class="loader" id="loader-lt6"></div></div>
  <div class="last-update" id="update-lt6">-</div>
  <div id="table-lt6">Memuat...</div>
</div>

<script>
/* =============================
   SUMBER DATA
============================= */
const sources={
  joglo:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
  kantin:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
  lt6:'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2q5WkdqPKnd4D37-45O3LSc2KC7nMfRVDWz2crolUEyUOgnhuHxjGgU42BG0q_ddnl8vw_DJ_mcRV/pub?gid=0&single=true&output=csv'
};

const lastData={joglo:[],kantin:[],lt6:[]};


/* =============================
   ⭐ TAMBAHAN DETEKSI WAKTU ESP
============================= */

const MAX_DELAY_SECONDS=120;

function parseESPTime(str){
  if(!str)return null;
  const now=new Date();

  if(/^\d{2}:\d{2}:\d{2}$/.test(str)){
    const [h,m,s]=str.split(":");
    return new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,s);
  }

  const d=new Date(str);
  return isNaN(d)?null:d;
}

function isTimeStale(str){
  const t=parseESPTime(str);
  if(!t)return false;
  return ((Date.now()-t.getTime())/1000)>MAX_DELAY_SECONDS;
}

function markOffline(key,state){
  document.getElementById("section-"+key).style.border=
    state?"3px solid #e74c3c":"none";
}


/* =============================
   FUNGSI LAMA (TIDAK DIUBAH)
============================= */

function getHeaders(key){
  if(key==="joglo")return["Waktu","Status Pompa","Level Tandon","Suhu Pompa","RSSI","IP"];
  if(key==="kantin")return["Waktu","Status Pompa","Level Tandon","Suhu Pompa","MCB","RSSI","IP"];
  if(key==="lt6")return["Waktu","Level Tandon"];
}

function createTableHTML(dataArr,key){
  if(!dataArr.length)return"Data kosong";

  const headers=getHeaders(key);
  const cells=dataArr[0].split(",").slice(0,headers.length);

  /* ===== cek waktu ===== */
  const offline=isTimeStale(cells[0]);
  markOffline(key,offline);

  const row=cells.map((val,i)=>{

    if(i===0 && offline){
      return `<td><span class="badge off">OFFLINE</span><br>${val}</td>`;
    }

    const changed=lastData[key][i]!==val;
    lastData[key][i]=val;

    return `<td class="${changed?'changed':''}">${val}</td>`;
  }).join("");

  return `<table>
    <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
    <tr>${row}</tr>
  </table>`;
}

function updateTimeText(id){
  document.getElementById(id).textContent=
    "Terakhir update: "+new Date().toLocaleTimeString("id-ID");
}

function fetchCSV(url,key){
  const tableId="table-"+key;
  const loaderId="loader-"+key;
  const updateId="update-"+key;

  document.getElementById(loaderId).style.display="inline-block";

  fetch(url)
  .then(r=>r.text())
  .then(t=>{
    const rows=t.trim().split("\n").slice(1,2);
    document.getElementById(tableId).innerHTML=createTableHTML(rows,key);
    updateTimeText(updateId);
    document.getElementById(loaderId).style.display="none";
  });
}

function refreshAll(){
  fetchCSV(sources.joglo,"joglo");
  fetchCSV(sources.kantin,"kantin");
  fetchCSV(sources.lt6,"lt6");
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");
}

setInterval(refreshAll,10000);
refreshAll();
</script>

</body>
</html>
