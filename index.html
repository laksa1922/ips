<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pompa & Tandon</title>

  <!-- ICON HALAMAN -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

  <style>
    :root {
      --bg: #f5f7fa;
      --text: #333;
      --card: #fff;
      --card-shadow: rgba(0,0,0,0.08);
      --table-head: #f0f2f5;
      --table-border: #eaeaea;
      --accent: #2c3e50;
      --accent-light: #3498db;
    }
    body.dark {
      --bg: #111;
      --text: #eee;
      --card: #1e1e1e;
      --card-shadow: rgba(0,0,0,0.4);
      --table-head: #2a2a2a;
      --table-border: #333;
      --accent: #ecf0f1;
      --accent-light: #3498db;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px 15px;
      border-bottom: 2px solid var(--accent-light);
      flex-wrap: wrap;
    }

    .header img {
      max-width: 260px;
      width: 90%;
      height: auto;
    }

    .header-text {
      text-align: left;
    }

    .header-text h1 {
      margin: 0;
      font-size: 2em;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .header-text p {
      margin: 5px 0 0;
      font-size: 1em;
      color: var(--accent-light);
      font-style: italic;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        text-align: center;
      }
      .header-text {
        text-align: center;
      }
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.9em;
      color: var(--accent);
      border-top: 1px solid var(--table-border);
    }
    body.dark .footer {
      color: var(--accent-light);
    }

    /* Tombol dark mode */
    .toggle-dark {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #3498db;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 4px 10px var(--card-shadow);
      margin-bottom: 20px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 8px;
    }

    .last-update {
      font-size: 0.9em;
      color: #777;
      margin-bottom: 12px;
    }
    body.dark .last-update { color: #aaa; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--table-border);
      text-align: center;
    }

    th {
      background: var(--table-head);
      font-weight: 600;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85em;
      color: #fff;
      display: inline-block;
      min-width: 60px;
    }

    .on { background: #27ae60; }
    .off { background: #e74c3c; }
    .rendah { background: #e74c3c; }
    .normal { background: #2980b9; }
    .penuh { background: #f1c40f; color:#000; }
    .mcb-normal { background: #2980b9; }
    .trip { background: #f1c40f; color:#000; }

    .loader {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3498db;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: .6; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }
    .table-container table {
      min-width: 500px;
    }
  </style>
</head>

<body>

<button class="toggle-dark" onclick="toggleDarkMode()">🌙</button>

<!-- HEADER + LOGO -->
<div class="header">
  <img src="https://www.adihusadakapasari.co.id/images/logo.png" alt="Logo RS Adi Husada Kapasari">
  <div class="header-text">
    <h1>⚙️ Monitoring Pompa & Tandon</h1>
    <p>Sistem Pemantauan Cerdas Real-time</p>
  </div>
</div>

<div class="card" id="section-joglo">
  <div class="card-header">📍 Joglo <div class="loader" id="loader-joglo"></div></div>
  <div class="last-update" id="update-joglo">Terakhir update: -</div>
  <div id="table-joglo">Memuat data...</div>
</div>

<div class="card" id="section-kantin">
  <div class="card-header">📍 Kantin <div class="loader" id="loader-kantin"></div></div>
  <div class="last-update" id="update-kantin">Terakhir update: -</div>
  <div id="table-kantin">Memuat data...</div>
</div>

<div class="card" id="section-lt6">
  <div class="card-header">📍 Lantai 6 <div class="loader" id="loader-lt6"></div></div>
  <div class="last-update" id="update-lt6">Terakhir update: -</div>
  <div id="table-lt6">Memuat data...</div>
</div>

<div class="footer">
  ⚡ Dibuat oleh <b>Instalasi Pemelihara Sarana (IPS)</b><br>
  Rumah Sakit Adi Husada Kapasari
</div>

<script>
  const sources = {
    joglo: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
    kantin: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
    lt6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2q5WkdqPKnd4D37-45O3LSc2KC7nMfRVDWz2crolUEyUOgnhuHxjGgU42BG0q_ddnl8vw_DJ_mcRV/pub?gid=0&single=true&output=csv'
  };

  function toggleDarkMode() {
    document.body.classList.toggle("dark");
    const btn = document.querySelector(".toggle-dark");
    btn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
  }
</script>

</body>
</html>
