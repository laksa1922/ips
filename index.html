<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pompa & Tandon</title>

  <!-- ICON HALAMAN -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

  <style>
    :root {
      --bg: #f5f7fa;
      --text: #333;
      --card: #fff;
      --card-shadow: rgba(0,0,0,0.08);
      --table-head: #f0f2f5;
      --table-border: #eaeaea;
      --accent: #2c3e50;
      --accent-light: #3498db;
    }
    body.dark {
      --bg: #111;
      --text: #eee;
      --card: #1e1e1e;
      --card-shadow: rgba(0,0,0,0.4);
      --table-head: #2a2a2a;
      --table-border: #333;
      --accent: #ecf0f1;
      --accent-light: #3498db;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .header {
      text-align: center;
      padding: 25px 15px 15px;
      border-bottom: 2px solid var(--accent-light);
    }
    .header h1 {
      margin: 0;
      font-size: 2em;
      font-weight: 700;
      color: var(--accent);
    }
    .header p {
      margin: 5px 0 0;
      color: var(--accent-light);
      font-style: italic;
    }

    .footer {
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.9em;
      color: var(--accent);
      border-top: 1px solid var(--table-border);
    }

    .toggle-dark {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #3498db;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 4px 10px var(--card-shadow);
      margin-bottom: 20px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .last-update {
      font-size: 0.9em;
      color: #777;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--table-border);
      text-align: center;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85em;
      color: #fff;
    }

    .on{background:#27ae60;}
    .off{background:#e74c3c;}
    .rendah{background:#e74c3c;}
    .normal{background:#2980b9;}
    .penuh{background:#f1c40f;color:#000;}
    .mcb-normal{background:#2980b9;}
    .trip{background:#f1c40f;color:#000;}

    .loader {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3498db;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,100%{transform:scale(1);opacity:.6;}
      50%{transform:scale(1.5);opacity:1;}
    }
  </style>
</head>

<body>

<button class="toggle-dark" onclick="toggleDarkMode()">🌙</button>

<div class="header">
  <h1>⚙️ Monitoring Pompa & Tandon</h1>
  <p>Sistem Pemantauan Cerdas Real-time</p>
</div>

<div class="card" id="section-joglo">
  <div class="card-header">📍 Joglo <div class="loader" id="loader-joglo"></div></div>
  <div class="last-update" id="update-joglo">Terakhir update: -</div>
  <div id="table-joglo">Memuat data...</div>
</div>

<div class="card" id="section-kantin">
  <div class="card-header">📍 Kantin <div class="loader" id="loader-kantin"></div></div>
  <div class="last-update" id="update-kantin">Terakhir update: -</div>
  <div id="table-kantin">Memuat data...</div>
</div>

<div class="card" id="section-lt6">
  <div class="card-header">📍 Lantai 6 <div class="loader" id="loader-lt6"></div></div>
  <div class="last-update" id="update-lt6">Terakhir update: -</div>
  <div id="table-lt6">Memuat data...</div>
</div>

<div class="footer">
⚡ Dibuat oleh <b>Instalasi Pemelihara Sarana (IPS)</b><br>
Rumah Sakit Adi Husada Kapasari
</div>

<script>
const sources = {
  joglo:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
  kantin:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
  lt6:'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2q5WkdqPKnd4D37-45O3LSc2KC7nMfRVDWz2crolUEyUOgnhuHxjGgU42BG0q_ddnl8vw_DJ_mcRV/pub?gid=0&single=true&output=csv'
};

function updateTimeText(id){
  const now = new Date();

  const waktu = now.toLocaleString("id-ID",{
    timeZone:"Asia/Jakarta",
    weekday:"short",
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });

  document.getElementById(id).textContent =
    "Terakhir update: " + waktu + " WIB";
}

function fetchAndDisplayCSV(url,key){
  const tableId="table-"+key;
  const loaderId="loader-"+key;
  const updateId="update-"+key;

  document.getElementById(loaderId).style.display="inline-block";

  fetch(url)
  .then(res=>res.text())
  .then(data=>{
    const rows=data.trim().split("\n").slice(1,2);
    document.getElementById(tableId).innerHTML=rows[0];
    updateTimeText(updateId);
    document.getElementById(loaderId).style.display="none";
  });
}

function refreshAll(){
  fetchAndDisplayCSV(sources.joglo,"joglo");
  fetchAndDisplayCSV(sources.kantin,"kantin");
  fetchAndDisplayCSV(sources.lt6,"lt6");
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");
}

window.addEventListener("DOMContentLoaded",()=>{
  refreshAll();
  setInterval(refreshAll,10000);
});
</script>

</body>
</html>
