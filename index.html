<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pompa & Tandon</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

<style>
:root{
--bg:#f5f7fa;--text:#333;--card:#fff;
--card-shadow:rgba(0,0,0,.08);
--table-head:#f0f2f5;--table-border:#eaeaea;
--accent:#2c3e50;--accent-light:#3498db;
}
body.dark{
--bg:#0b0f14;--text:#e0f2f1;--card:#0e141b;
--card-shadow:rgba(0,255,200,.25);
--table-head:#0f1923;--table-border:#1a2633;
--accent:#00ffcc;--accent-light:#00bcd4;
}
body{
margin:0;padding:20px;font-family:Segoe UI,sans-serif;
background:var(--bg);color:var(--text);
transition:.3s;
}
body.dark{
background:
linear-gradient(rgba(0,255,180,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,180,.04) 1px,transparent 1px),
var(--bg);
background-size:30px 30px;
}

/* HEADER */
.header{text-align:center;padding:25px 15px;border-bottom:2px solid var(--accent-light)}
.header h1{margin:0;font-size:2em;color:var(--accent)}
.header p{margin:5px 0 0;color:var(--accent-light);font-style:italic}

/* FOOTER */
.footer{text-align:center;padding:15px;margin-top:30px;font-size:.9em;border-top:1px solid var(--table-border)}
body.dark .footer{color:#7fffd4}

/* DARK BUTTON */
.toggle-dark{
position:fixed;top:15px;right:15px;width:40px;height:40px;
border-radius:50%;border:none;background:#3498db;color:#fff;
font-size:18px;cursor:pointer;z-index:1000;
}
body.dark .toggle-dark{background:#00ffcc;color:#003}

/* CARD */
.card{
background:var(--card);border-radius:14px;padding:18px;
box-shadow:0 4px 10px var(--card-shadow);
margin-bottom:20px;
}
body.dark .card{
border:1px solid rgba(0,255,200,.2);
box-shadow:0 0 25px rgba(0,255,200,.15);
}
.card-header{display:flex;justify-content:space-between;font-weight:bold}
.last-update{font-size:.9em;color:#777;margin-bottom:10px}
body.dark .last-update{color:#8ad}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.9em}
th,td{padding:8px;border-bottom:1px solid var(--table-border);text-align:center}
th{background:var(--table-head)}
tr:hover td{background:rgba(0,0,0,.04)}
body.dark tr:hover td{background:rgba(0,255,200,.05)}

.badge{
padding:3px 8px;border-radius:6px;font-weight:bold;
font-size:.85em;color:#fff;min-width:60px;display:inline-block;
}
.on{background:#27ae60}
.off{background:#e74c3c}
.rendah{background:#e74c3c}
.normal{background:#2980b9}
.penuh{background:#f1c40f;color:#000}
.trip{background:#ff9800;color:#000}

/* LOADER */
.loader{
width:10px;height:10px;border-radius:50%;
background:#3498db;animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.5)}}

/* CHANGE FLASH */
.changed{animation:flash 1.5s}
@keyframes flash{
0%{background:rgba(52,152,219,.2)}
50%{background:rgba(52,152,219,.6)}
100%{background:transparent}
}

/* ===== SCADA PUMP ===== */
.pump-wrap{display:flex;justify-content:center;margin:10px 0}
.pump{width:90px;height:90px}
.pump.off svg{opacity:.35;filter:grayscale(100%)}
.pump.on svg{filter:drop-shadow(0 0 10px rgba(0,255,200,.9))}
.fan{transform-origin:50% 50%}
.pump.on .fan{animation:spin 1s linear infinite}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
.water{opacity:0}
.pump.on .water{opacity:1;animation:flow .6s infinite alternate}
@keyframes flow{from{transform:translateY(0)}to{transform:translateY(6px)}}
</style>
</head>

<body>
<button class="toggle-dark" onclick="toggleDarkMode()">🌙</button>

<div class="header">
<h1>⚙️ Monitoring Pompa & Tandon</h1>
<p>Sistem Pemantauan Cerdas Real-time</p>
</div>

<!-- JOGLO -->
<div class="card">
<div class="card-header">📍 Joglo <div class="loader"></div></div>
<div class="last-update" id="update-joglo">-</div>
<div class="pump-wrap"><div class="pump off" id="pump-joglo">
<svg viewBox="0 0 100 100">
<rect x="15" y="35" width="70" height="30" rx="8" fill="#555"/>
<circle cx="50" cy="50" r="14" fill="#999"/>
<g class="fan">
<rect x="48" y="30" width="4" height="15" fill="#fff"/>
<rect x="48" y="55" width="4" height="15" fill="#fff"/>
<rect x="30" y="48" width="15" height="4" fill="#fff"/>
<rect x="55" y="48" width="15" height="4" fill="#fff"/>
</g>
<rect class="water" x="85" y="42" width="8" height="16" rx="3" fill="#3498db"/>
</svg></div></div>
<div id="table-joglo">Memuat data...</div>
</div>

<!-- KANTIN -->
<div class="card">
<div class="card-header">📍 Kantin <div class="loader"></div></div>
<div class="last-update" id="update-kantin">-</div>
<div class="pump-wrap"><div class="pump off" id="pump-kantin">
<svg viewBox="0 0 100 100"> (SVG SAMA) </svg>
</div></div>
<div id="table-kantin">Memuat data...</div>
</div>

<!-- LANTAI 6 -->
<div class="card">
<div class="card-header">📍 Lantai 6 <div class="loader"></div></div>
<div class="last-update" id="update-lt6">-</div>
<div id="table-lt6">Memuat data...</div>
</div>

<div class="footer">
⚡ Instalasi Pemelihara Sarana (IPS)<br>RS Adi Husada Kapasari
</div>

<script>
const sources={
joglo:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
kantin:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
lt6:'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2q5WkdqPKnd4D37-45O3LSc2KC7nMfRVDWz2crolUEyUOgnhuHxjGgU42BG0q_ddnl8vw_DJ_mcRV/pub?gid=0&single=true&output=csv'
};

const lastData={joglo:[],kantin:[],lt6:[]};

function updatePump(key,val){
const p=document.getElementById("pump-"+key);
if(!p||!val)return;
p.className="pump "+(val.toLowerCase().includes("nyala")?"on":"off");
}

function createTableHTML(rows,key){
const cells=rows[0].split(",");
updatePump(key,cells[1]);
return `<table><tr>${cells.map(v=>`<td>${v}</td>`).join("")}</tr></table>`;
}

function load(key){
fetch(sources[key]).then(r=>r.text()).then(t=>{
const rows=t.trim().split("\n").slice(1,2);
document.getElementById("table-"+key).innerHTML=createTableHTML(rows,key);
document.getElementById("update-"+key).textContent="Update: "+new Date().toLocaleTimeString("id-ID");
});
}

function toggleDarkMode(){
document.body.classList.toggle("dark");
localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
}

if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark");

load("joglo");load("kantin");load("lt6");
setInterval(()=>{load("joglo");load("kantin");load("lt6")},10000);
</script>

</body>
</html>
