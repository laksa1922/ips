<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pompa & Tandon</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --text: #333;
      --card: #fff;
      --card-shadow: rgba(0,0,0,0.08);
      --table-head: #f0f2f5;
      --table-border: #eaeaea;
      --accent: #2c3e50;
      --accent-light: #3498db;
    }

    body.dark {
      --bg: #111;
      --text: #eee;
      --card: #1e1e1e;
      --card-shadow: rgba(0,0,0,0.4);
      --table-head: #2a2a2a;
      --table-border: #333;
      --accent: #ecf0f1;
      --accent-light: #3498db;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      text-align: center;
      padding: 25px 15px 15px;
      border-bottom: 2px solid var(--accent-light);
    }

    .header h1 {
      margin: 0;
      font-size: 2em;
      color: var(--accent);
    }

    .header p {
      color: var(--accent-light);
      font-style: italic;
    }

    .toggle-dark {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #3498db;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      z-index: 1000;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 4px 10px var(--card-shadow);
      margin-bottom: 20px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .last-update {
      font-size: 0.9em;
      color: #777;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--table-border);
      text-align: center;
    }

    th {
      background: var(--table-head);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85em;
      color: #fff;
      display: inline-block;
    }

    .on { background: #27ae60; }
    .off, .rendah { background: #e74c3c; }
    .normal { background: #2980b9; }
    .penuh { background: #f1c40f; color: #000; }
    .mcb-normal { background: #2980b9; }
    .trip { background: #f1c40f; color: #000; }

    .loader {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3498db;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: .6; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .changed {
      animation: flash 1.5s;
    }

    @keyframes flash {
      0% { background: rgba(52,152,219,.3); }
      100% { background: transparent; }
    }

    /* === PENANDA ESP BERHENTI === */
    .time-stale {
      color: #e74c3c;
      font-weight: bold;
      background: rgba(231, 76, 60, 0.15);
      border-radius: 6px;
    }

    .table-container {
      overflow-x: auto;
    }

    .footer {
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.9em;
      border-top: 1px solid var(--table-border);
    }
  </style>
</head>

<body>
<button class="toggle-dark" onclick="toggleDarkMode()">🌙</button>

<div class="header">
  <h1>⚙️ Monitoring Pompa & Tandon</h1>
  <p>Sistem Pemantauan Cerdas Real-time</p>
</div>

<div class="card">
  <div class="card-header">📍 Joglo <div class="loader" id="loader-joglo"></div></div>
  <div class="last-update" id="update-joglo">Terakhir update: -</div>
  <div id="table-joglo">Memuat data...</div>
</div>

<div class="card">
  <div class="card-header">📍 Kantin <div class="loader" id="loader-kantin"></div></div>
  <div class="last-update" id="update-kantin">Terakhir update: -</div>
  <div id="table-kantin">Memuat data...</div>
</div>

<div class="card">
  <div class="card-header">📍 Lantai 6 <div class="loader" id="loader-lt6"></div></div>
  <div class="last-update" id="update-lt6">Terakhir update: -</div>
  <div id="table-lt6">Memuat data...</div>
</div>

<div class="footer">
  ⚡ Instalasi Pemelihara Sarana (IPS)<br>
  RS Adi Husada Kapasari
</div>

<script>
const STALE_LIMIT_MINUTES = 10;

const sources = {
  joglo: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9RrlaFN7h2UMkV_KRWJ0hU53Uwp2kCyjwduvxkvhv7rqJc7j71mXBai3hF3aW6R7EGYNzi5TWQSs/pub?gid=0&single=true&output=csv',
  kantin: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp3hZufwknJEpOfvD_6YlB_lQEWwcJ-hMgKVfNoV1-jJAKeQB979Acs69cXCKCZVkf01OhwFn8fHlD/pub?gid=0&single=true&output=csv',
  lt6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2q5WkdqPKnd4D37-45O3LSc2KC7nMfRVDWz2crolUEyUOgnhuHxjGgU42BG0q_ddnl8vw_DJ_mcRV/pub?gid=0&single=true&output=csv'
};

const lastData = { joglo: [], kantin: [], lt6: [] };

function getHeaders(k) {
  if (k === "joglo") return ["Waktu","Status Pompa","Level Tandon","Suhu Pompa","RSSI","IP"];
  if (k === "kantin") return ["Waktu","Status Pompa","Level Tandon","Suhu Pompa","MCB","RSSI","IP"];
  if (k === "lt6") return ["Waktu","Level Tandon"];
  return [];
}

function applyStatus(val, key, i) {
  const lc = val.toLowerCase();
  if (lc.includes("nyala")) return "on";
  if (lc.includes("mati")) return "off";
  if (lc.includes("rendah")) return "rendah";
  if (lc.includes("penuh")) return "penuh";
  if (lc.includes("trip")) return "trip";
  return "";
}

function createTableHTML(dataArr, key) {
  if (!dataArr.length) return "Data tidak tersedia.";
  const headers = getHeaders(key);
  const cells = dataArr[0].split(",").slice(0, headers.length);
  const now = new Date();

  const row = cells.map((val, i) => {
    let cls = "";
    if (i === 0) {
      const t = new Date(val.replace(/-/g,"/"));
      if (!isNaN(t)) {
        const diff = (now - t) / 60000;
        if (diff > STALE_LIMIT_MINUTES) cls = "time-stale";
      }
    }
    const status = applyStatus(val, key, i);
    return `<td class="${cls}">${status ? `<span class="badge ${status}">${val}</span>` : val}</td>`;
  }).join("");

  return `
  <div class="table-container">
    <table>
      <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
      <tr>${row}</tr>
    </table>
  </div>`;
}

function fetchCSV(url, key) {
  fetch(url).then(r=>r.text()).then(t=>{
    const row = t.trim().split("\n").slice(1,2);
    document.getElementById("table-"+key).innerHTML = createTableHTML(row, key);
    document.getElementById("update-"+key).textContent =
      "Terakhir update: " + new Date().toLocaleTimeString("id-ID");
    document.getElementById("loader-"+key).style.display="none";
  });
}

function refreshAll(){
  fetchCSV(sources.joglo,"joglo");
  fetchCSV(sources.kantin,"kantin");
  fetchCSV(sources.lt6,"lt6");
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");
}

refreshAll();
setInterval(refreshAll, 10000);
</script>
</body>
</html>
